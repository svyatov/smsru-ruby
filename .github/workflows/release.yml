name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - run: bundle install

      - run: bundle exec rake test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Verify the tag matches the gemspec version
        run: |
          ruby -e 'spec = Gem::Specification.load("smsru-ruby.gemspec"); tag = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v"); abort("tag #{tag.inspect} does not match gemspec version #{spec.version.to_s.inspect}") unless tag == spec.version.to_s'

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build smsru-ruby.gemspec --output "pkg/smsru-ruby-${GITHUB_REF_NAME#v}.gem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-gem
          path: pkg/
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, build]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-gem
          path: pkg/

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Sign the gem with Sigstore
        run: |
          pkg="pkg/smsru-ruby-${GITHUB_REF_NAME#v}.gem"
          gem exec --conservative sigstore-cli:0.2.3 sign "$pkg" --bundle "$pkg.sigstore.json"

      - name: Push to RubyGems with provenance
        run: |
          pkg="pkg/smsru-ruby-${GITHUB_REF_NAME#v}.gem"
          gem push "$pkg" --attestation "$pkg.sigstore.json"
