name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby_version: [ruby-head, "4.0", "3.4", "3.3"]

    env:
      COVERAGE: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
        continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

      - run: bundle exec rake
        continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

      - name: Type check (Steep, strict)
        run: bundle exec rake steep
        if: ${{ matrix.ruby_version == '4.0' }}

      - name: Type coverage gate (100%, Steep stats)
        run: bundle exec rake steep:coverage
        if: ${{ matrix.ruby_version == '4.0' }}

      - name: Runtime signature check (RBS::Test)
        run: bundle exec rake rbs:test
        if: ${{ matrix.ruby_version == '4.0' }}

      - name: Documentation coverage
        run: bundle exec rake yard:stats
        if: ${{ matrix.ruby_version == '4.0' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: svyatov/smsru-ruby
        if: ${{ matrix.ruby_version == '4.0' }}
